## host to bind, can also be passed via CLI args
# host = "127.0.0.1"

## port to bind, can also be passed via CLI args
# port = 8888

## whether to allow anyone to register an account
# open_registration = false

## URI for postgres (using development creds here)
# db_uri="postgres://username:password@localhost/atuin"
# db_uri="sqlite:///config/atuin-server.db"
# db_uri = "mysql://root:foobar@127.0.0.1/atuin"

## file holding the database password, which is then left out of db_uri
# db_password_file = "/run/secrets/atuin_db_password"

## Maximum size for one record entry
## 1024 * 1024 * 1024
# max_record_size = 1073741824

## Webhook to be called when user registers on the servers
# register_webhook_username = ""

# [metrics]
# enable = false
# host = 127.0.0.1
# port = 9001

## Browser login with an OpenID Connect provider. See OIDC.md in this fork.
## Setting this section disables password login/registration, regardless of open_registration.
# [oidc]
# issuer_url = "https://auth.example.com/realms/home"
# client_id = "atuin"
# client_secret_file = "/run/secrets/oidc-client-secret"
# public_url = "https://atuin.example.com"
# session_ttl_seconds = 2592000
