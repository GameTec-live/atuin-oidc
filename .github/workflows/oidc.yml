name: OIDC server
on:
  push:
    branches: [oidc]
  pull_request:
    branches: [oidc]
  workflow_dispatch:
concurrency:
  group: oidc-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p atuin-server --lib
      - run: cargo test --locked -p atuin-server --test sync
      - run: cargo clippy --locked -p atuin-server --all-targets -- -D warnings
      - run: cargo doc --locked -p atuin-server --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  image:
    needs: test
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}-${{ matrix.arch }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - name: Build server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.oidc
          platforms: ${{ matrix.platform }}
          load: true
          tags: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=oidc-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=oidc-${{ matrix.arch }}
      - name: Check server binary
        run: docker run --rm "$IMAGE" --version
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/oidc'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push platform image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/oidc'
        run: docker push "$IMAGE"

  publish:
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/oidc'
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create \
            --tag "$image:latest" \
            --tag "$image:oidc" \
            --tag "$image:sha-${GITHUB_SHA}" \
            "$image:sha-${GITHUB_SHA}-amd64" \
            "$image:sha-${GITHUB_SHA}-arm64"
          docker buildx imagetools inspect "$image:sha-${GITHUB_SHA}"
